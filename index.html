<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>agung.eu.org</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        .hero-section {
            min-height: 100vh;
            background-image: url('bg0.avif');
            background-size: cover;
            background-position: right center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            padding: 0 10%;
        }

        .hero-content {
            max-width: 50%;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
        }

        .hero-content h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            color: #111;
        }

        .hero-content h1 span {
            color: #888;
        }

        .hero-content p {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
        }

        .cta-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: #2b2b2b;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #555;
        }

        @media (max-width: 768px) {
            .hero-section {
                background-position: right bottom;
                align-items: flex-start;
                padding-top: 15vh;
            }

            .hero-content {
                max-width: 100%;
                text-align: center;
                background: rgba(255, 255, 255, 0.6);
                padding: 20px;
                border-radius: 12px;
                backdrop-filter: blur(2px);
            }

            .hero-content h1 {
                font-size: 2.5rem;
            }

            .hero-content p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <div class="hero-content">
            <h1>agung<span>.eu.org</span></h1>
            <!-- p>bla..bla..bla</p -->
            <a href="mailto:halo@agung.eu.org" class="cta-button"> halo@agung.eu.org</a>
        </div>
    </section>

</body>
</html>
